<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bright Clean Services</title>
</head>
<body>

<h1>Bright Clean Services</h1>
<h2>Request a Cleaning Service</h2>

<form>
    <label>Full Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Phone:</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Service Type:</label><br>
    <select name="service_type">
        <option>Home Cleaning</option>
        <option>Deep Cleaning</option>
        <option>Office Cleaning</option>
    </select><br><br>

    <label>Property Size:</label><br>
    <input type="text" name="property_size"><br><br>

    <label>Preferred Date:</label><br>
    <input type="date" name="preferred_date"><br><br>

    <button type="submit">Submit Request</button>
</form>

</body>
</html>
